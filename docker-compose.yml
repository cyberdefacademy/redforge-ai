services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redforge
      POSTGRES_USER: redforge
      POSTGRES_PASSWORD: redforge_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redforge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://redforge:redforge_secret_2026@db:5432/redforge
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-to-32+random-chars-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  ollama_data:
