services:
  # Dev defaults use ${VAR:-default} so no secrets are committed.
  # Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6399}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "${API_PORT:-8088}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://redforge@localhost:5432/redforge}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-32+random-chars-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3088,http://localhost:5173}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVIDENCE_DIR: /var/lib/redforge/evidence
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin via nginx proxy (/api, /ws -> api:8000). Set
        # VITE_API_URL in .env only for direct-browser-to-API setups.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-3088}:80"
    environment:
      # Inform frontend where the API lives
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8088}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redisdata: {}